name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Pasang ikon dari icons.b64
        run: |
          base64 -d icons.b64 > /tmp/icons.zip
          unzip -o /tmp/icons.zip -d app/src/main/res
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ippho-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Kalau push-nya berupa tag v1, v2, ...: lampirkan APK ke Release tag itu.
      # Berfungsi baik saat Release dibuat dari UI GitHub maupun belum ada:
      # create gagal (sudah ada) tidak masalah, upload tetap melampirkan APK-nya.
      - name: Buat Release dari tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "ippho ${{ github.ref_name }}" \
            --notes "APK game Kubus 3x3 ippho. Unduh app-debug.apk lalu instal di HP Android." \
            || true
          gh release upload "${{ github.ref_name }}" \
            app/build/outputs/apk/debug/app-debug.apk --clobber
